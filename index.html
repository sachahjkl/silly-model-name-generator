<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate gloriously unnecessary AI model names."
    />
    <meta name="theme-color" content="#000000" />
    <title>Model Nonsense</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <section class="generator" aria-label="AI model name generator">
        <h1 id="model-name" aria-live="polite"></h1>
        <div class="actions">
          <button id="generate-button" type="button">Regenerate</button>
          <button id="copy-button" type="button">
            <span>Copy name</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
